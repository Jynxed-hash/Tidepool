# Posts a fix task when Build or Test fails, and clears the ci-fix label when both are green.
# Called by build.yml and test.yml. This workflow does not push and does not merge.
# permissions stay at contents: read. There is no contents: write grant anywhere in this file.
name: CI fix

on:
  workflow_call:
    inputs:
      outcome:
        description: failure writes a fix task; success clears ci-fix when Build and Test are both green
        required: true
        type: string
      area:
        description: Build or Test
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read
  actions: read

jobs:
  dispatch:
    name: Publish the fix task
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.sha }}
          persist-credentials: false

      - name: Check the fix-task script
        run: node .github/scripts/ci-fix.js

      - name: Collect failed logs
        if: inputs.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP"
          log="$RUNNER_TEMP/ci-fix-log.txt"
          : > "$log"
          for _ in 1 2 3 4 5 6; do
            if gh run view "$GITHUB_RUN_ID" --log-failed > "$log"; then
              if [[ -s "$log" ]]; then
                break
              fi
            fi
            sleep 5
          done

      - name: Comment, label, or clear
        uses: actions/github-script@v7
        env:
          CI_FIX_OUTCOME: ${{ inputs.outcome }}
          CI_FIX_AREA: ${{ inputs.area }}
          CI_FIX_LOG: ${{ runner.temp }}/ci-fix-log.txt
        with:
          script: |
            const { handle } = require(process.env.GITHUB_WORKSPACE + '/.github/scripts/ci-fix.js')
            await handle({
              github,
              context,
              core,
              outcome: process.env.CI_FIX_OUTCOME,
              area: process.env.CI_FIX_AREA,
              logPath: process.env.CI_FIX_LOG || '',
            })

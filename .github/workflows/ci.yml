name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Test parsers and hook installer
        run: swift test
      - name: Build Tidepool and cmb-hook
        run: swift build -c release --product Tidepool --product cmb-hook

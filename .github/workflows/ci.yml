name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  macos:
    # Latest hosted image whose Xcode can build swift-tools-version 6.2
    # and a bundle whose LSMinimumSystemVersion is 26. xcode-27 is macOS 27
    # with the Xcode 27 toolchain (Apple Silicon). The job selects Xcode
    # explicitly below; the image default is not assumed.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          selected=""
          for app in \
            /Applications/Xcode_27.1.app \
            /Applications/Xcode_27.1.0.app \
            /Applications/Xcode_27.app \
            /Applications/Xcode.app
          do
            if [[ -d "$app" ]]; then
              selected="$app"
              break
            fi
          done
          if [[ -z "$selected" ]]; then
            echo "No Xcode app that can build Swift tools 6.2 for macOS 26." >&2
            ls -d /Applications/Xcode*.app >&2 || true
            exit 1
          fi
          sudo xcode-select -s "$selected"
          echo "DEVELOPER_DIR=$(xcode-select -p)"
          xcodebuild -version
          swift --version

      - name: Debug build
        run: swift build

      - name: Test
        run: swift test

      - name: Assemble Tidepool.app
        run: scripts/assemble-app.sh

      - name: Verify bundle
        run: |
          set -euo pipefail
          bin="dist/Tidepool.app/Contents/MacOS"
          test -x "$bin/Tidepool"
          test -x "$bin/cmb-hook"
          plutil -lint dist/Tidepool.app/Contents/Info.plist
          minimum="$(plutil -extract LSMinimumSystemVersion raw dist/Tidepool.app/Contents/Info.plist)"
          test "$minimum" = "26.0"
          # Ad-hoc signature so codesign --verify has something to check.
          # The runner has no Developer ID identity. This is not notarization.
          codesign --force --deep --sign - dist/Tidepool.app
          codesign --verify --verbose=2 dist/Tidepool.app

      - name: Zip Tidepool.app
        run: ditto -c -k --keepParent dist/Tidepool.app dist/Tidepool.zip

      - name: Upload Tidepool.app
        uses: actions/upload-artifact@v4
        with:
          name: Tidepool
          path: dist/Tidepool.zip
          if-no-files-found: error
